[workspace]
members = [".", "harness/luminal", "harness/cute", "harness/burn"]

[package]
name = "eqtheory"
version = "0.1.0"
edition = "2024"
links = "mlxshim"

[dependencies]
cute-layout = { path = "../refs/cuda-rust/cuda-oxide/cute-rs-preview/cute-layout" }
egglog = { git = "https://github.com/egraphs-good/egglog", rev = "3787810fa259efc45237eecd98d7914a6b02256c" }
metal = { version = "0.31", features = ["mps"] }
objc = "0.2"
anyhow = "1"
prost = "0.13"

[build-dependencies]
prost-build = "0.13"
cc = "1"

[[bin]]
name = "compression"
path = "bin/compression.rs"

[[bin]]
name = "egraph"
path = "bin/egraph.rs"

[[bin]]
name = "cutematch"
path = "bin/cutematch.rs"

[[bin]]
name = "cutesat"
path = "bin/cutesat.rs"

[[bin]]
name = "cuteextract"
path = "bin/cuteextract.rs"

[[bin]]
name = "tmbench"
path = "bin/tmbench.rs"

[[bin]]
name = "nativerun"
path = "bin/nativerun.rs"

[[bin]]
name = "session"
path = "bin/session.rs"

[[bin]]
name = "onnxdump"
path = "bin/onnxdump.rs"

[[bin]]
name = "onnxcheck"
path = "bin/onnxcheck.rs"

[[bin]]
name = "onnxsession"
path = "bin/onnxsession.rs"

[[bin]]
name = "decodediff"
path = "bin/decodediff.rs"
