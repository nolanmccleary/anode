[workspace]
members = [".", "baseline"]

[package]
name = "eqtheory"
version = "0.1.0"
edition = "2024"

[dependencies]
cute-layout = { path = "cute-layout" }
egglog = { git = "https://github.com/egraphs-good/egglog", rev = "3787810fa259efc45237eecd98d7914a6b02256c" }
metal = { version = "0.31", features = ["mps"] }
objc = "0.2"
anyhow = "1"

[[bin]]
name = "compression"
path = "src/compression.rs"

[[bin]]
name = "egraph"
path = "src/egraph.rs"

[[bin]]
name = "cutematch"
path = "src/cutematch.rs"

[[bin]]
name = "cutesat"
path = "src/cutesat.rs"

[[bin]]
name = "cuteextract"
path = "src/cuteextract.rs"

[[bin]]
name = "tmbench"
path = "src/tmbench.rs"

[[bin]]
name = "gemvbench"
path = "src/gemvbench.rs"

[[bin]]
name = "nativerun"
path = "src/nativerun.rs"

[[bin]]
name = "session"
path = "src/session.rs"
