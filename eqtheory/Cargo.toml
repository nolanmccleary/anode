[workspace]
members = [".", "baseline", "ffi", "burnrun"]

[package]
name = "eqtheory"
version = "0.1.0"
edition = "2024"

[dependencies]
cute-layout = { path = "cute-layout" }
egglog = { git = "https://github.com/egraphs-good/egglog", rev = "3787810fa259efc45237eecd98d7914a6b02256c" }
metal = { version = "0.31", features = ["mps"] }
objc = "0.2"
anyhow = "1"
prost = "0.13"

[build-dependencies]
prost-build = "0.13"

[[bin]]
name = "compression"
path = "src/compression.rs"

[[bin]]
name = "egraph"
path = "src/egraph.rs"

[[bin]]
name = "cutematch"
path = "src/cutematch.rs"

[[bin]]
name = "cutesat"
path = "src/cutesat.rs"

[[bin]]
name = "cuteextract"
path = "src/cuteextract.rs"

[[bin]]
name = "tmbench"
path = "src/tmbench.rs"

[[bin]]
name = "gemvbench"
path = "src/gemvbench.rs"

[[bin]]
name = "nativerun"
path = "src/nativerun.rs"

[[bin]]
name = "session"
path = "src/session.rs"

[[bin]]
name = "onnxdump"
path = "src/onnxdump.rs"

[[bin]]
name = "onnxcheck"
path = "src/onnxcheck.rs"

[[bin]]
name = "onnxsession"
path = "src/onnxsession.rs"

[[bin]]
name = "cutedriver"
path = "src/cutedriver.rs"

[[bin]]
name = "decodediff"
path = "src/decodediff.rs"
