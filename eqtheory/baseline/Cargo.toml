[package]
name = "eqtheory-baseline"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ab"
path = "src/ab.rs"

[[bin]]
name = "affineplan"
path = "src/affineplan.rs"

[[bin]]
name = "affinerun"
path = "src/affinerun.rs"

[[bin]]
name = "census"
path = "src/census.rs"

[[bin]]
name = "cuteab"
path = "src/cuteab.rs"

[[bin]]
name = "cutecompose"
path = "src/cutecompose.rs"

[[bin]]
name = "cutelower"
path = "src/cutelower.rs"

[[bin]]
name = "cuterun"
path = "src/cuterun.rs"

[[bin]]
name = "cuteviews"
path = "src/cuteviews.rs"

[[bin]]
name = "distribution"
path = "src/distribution.rs"

[[bin]]
name = "export_model"
path = "src/export_model.rs"

[[bin]]
name = "fusion"
path = "src/fusion.rs"

[[bin]]
name = "kernelcheck"
path = "src/kernelcheck.rs"

[[bin]]
name = "kerneldiff"
path = "src/kerneldiff.rs"

[[bin]]
name = "pipeline"
path = "src/pipeline.rs"

[[bin]]
name = "rsqrtcheck"
path = "src/rsqrtcheck.rs"

[[bin]]
name = "smoke"
path = "src/smoke.rs"

[dependencies]
eqtheory = { path = ".." }
cute-layout = { path = "../cute-layout" }
egglog = { git = "https://github.com/egraphs-good/egglog", rev = "3787810fa259efc45237eecd98d7914a6b02256c" }
luminal = { path = "../../refs/luminal", features = ["cute"] }
luminal_metal = { path = "../../refs/luminal/crates/luminal_metal", features = ["cute"] }
model_zoo = { path = "../../refs/luminal/crates/model_zoo" }
metal = { version = "0.31", features = ["mps"] }
anyhow = "1"
objc = "0.2"
